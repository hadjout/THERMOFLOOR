
name: THERMOFLOOR APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK=/usr/local/lib/android/sdk

          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools:$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android packages
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP files
        shell: bash
        run: |
          mkdir -p extracted/outer extracted/project

          for archive in ./*.zip; do
            [ -f "$archive" ] || continue
            unzip -o "$archive" -d extracted/outer
          done

          while IFS= read -r -d '' archive; do
            unzip -o "$archive" -d extracted/project
          done < <(find extracted/outer -type f -name "*.zip" -print0)

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find extracted -maxdepth 7 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ ! -f "$FILE" ]; then
            echo "App Gradle file not found"
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "Editing: $FILE"

          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          android_match = re.search(r'\bandroid\s*\{', content)

          if not android_match:
              print("Android block not found. Actual file:")
              print(content)
              raise SystemExit(1)

          if "compileOptions" not in content:
              java_block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              """
              content = content[:android_match.end()] + java_block + content[android_match.end():]

          if "kotlinOptions" not in content:
              kotlin_block = """
              kotlinOptions {
                  jvmTarget = '17'
              }
              """
              android_match = re.search(r'\bandroid\s*\{', content)
              content = content[:android_match.end()] + kotlin_block + content[android_match.end():]

          content = re.sub(
              r'jvmTarget\s*=\s*["\'][^"\']+["\']',
              "jvmTarget = '17'",
              content
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Java and Kotlin targets configured to 17")
          print(content)
          PY

      - name: Build THERMOFLOOR APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload THERMOFLOOR APK
        uses: actions/upload-artifact@v4
        with:
          name: THERMOFLOOR-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
