
name: THERMOFLOOR APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP archives
        shell: bash
        run: |
          mkdir -p extracted/outer
          mkdir -p extracted/project

          echo "Extracting repository ZIP files..."

          for archive in ./*.zip; do
            if [ -f "$archive" ]; then
              echo "Extracting: $archive"
              unzip -o "$archive" -d extracted/outer
            fi
          done

          echo "Extracting Android source ZIP files..."

          while IFS= read -r -d '' archive; do
            echo "Extracting nested archive: $archive"
            unzip -o "$archive" -d extracted/project
          done < <(find extracted/outer -type f -name "*.zip" -print0)

          echo "Searching Android project files..."
          find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 7 -type f
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build THERMOFLOOR APK
        run: |
          echo "Building THERMOFLOOR..."
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload THERMOFLOOR APK
        uses: actions/upload-artifact@v4
        with:
          name: THERMOFLOOR-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
