
name: THERMOFLOOR APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted/outer extracted/project

          for archive in ./*.zip; do
            [ -f "$archive" ] || continue
            unzip -o "$archive" -d extracted/outer
          done

          while IFS= read -r -d '' archive; do
            unzip -o "$archive" -d extracted/project
          done < <(find extracted/outer -type f -name "*.zip" -print0)

      - name: Find Android project
        shell: bash
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find extracted -maxdepth 7 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Fix Java and Kotlin targets
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "app/build.gradle not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              content = f.read()

          java_block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """

          kotlin_block = """
              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          if "compileOptions" not in content:
              content, count = re.subn(
                  r'android\s*\{',
                  lambda m: m.group(0) + java_block,
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("android block not found")

          if "kotlinOptions" not in content:
              content, count = re.subn(
                  r'android\s*\{',
                  lambda m: m.group(0) + kotlin_block,
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("android block not found for Kotlin")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Java 17 and Kotlin 17 configured")
          PY

          cat "$FILE"

      - name: Build THERMOFLOOR APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THERMOFLOOR-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
