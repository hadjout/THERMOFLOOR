
name: THERMOFLOOR APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP files
        run: |
          mkdir -p extracted
          for file in ./*.zip; do
            if [ -f "$file" ]; then
              unzip -o "$file" -d extracted
            fi
          done

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted . -name settings.gradle -not -path './.git/*' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THERMOFLOOR-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
